apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/colorecho0
  - colorecho0-config.yaml
  - colorecho0-sealedsecret.yaml
  - colorecho0-httpscaledobject.yaml
  - colorecho0-interceptor-ingress.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: colorecho0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: colorecho0
images:
